services:
  - type: web
    name: 5t4rbug
    runtime: python
    plan: 1c-2g
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT run:app
    healthCheckPath: /
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /var/data/5t4rbug.sqlite3
      - key: SESSION_COOKIE_SECURE
        value: "true"
    disk:
      name: 5t4rbug-data
      mountPath: /var/data
      sizeGB: 1
