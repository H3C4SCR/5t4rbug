{% extends 'base.html' %}
{% block title %}Entrar — 5T4RBUG{% endblock %}
{% block content %}
<section class="auth-card">
  <h1>Entrar</h1>
  <p>Volte para suas tarefas e escolha o próximo passo.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field"><label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="email" required maxlength="254"></div>
    <div class="field"><label for="password">Senha</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
    <button class="button button-primary" type="submit">Entrar</button>
  </form>
  <p>Ainda não tem conta? <a href="{{ url_for('auth.register') }}">Cadastre-se</a>.</p>
</section>
{% endblock %}
