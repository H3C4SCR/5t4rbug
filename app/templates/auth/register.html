{% extends 'base.html' %}
{% block title %}Criar conta — 5T4RBUG{% endblock %}
{% block content %}
<section class="auth-card">
  <h1>Criar conta</h1>
  <p>Use uma senha exclusiva com pelo menos 12 caracteres.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field"><label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="email" required maxlength="254"></div>
    <div class="field"><label for="password">Senha</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="12" required></div>
    <div class="field"><label for="confirmation">Repita a senha</label><input id="confirmation" name="confirmation" type="password" autocomplete="new-password" minlength="12" required></div>
    <button class="button button-primary" type="submit">Criar conta</button>
  </form>
  <p>Já tem conta? <a href="{{ url_for('auth.login') }}">Entrar</a>.</p>
</section>
{% endblock %}
